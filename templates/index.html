<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>穴馬ファインダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
        }
        .card-bg { background-color: #16213e; }
        .accent-gold { color: #d4af37; }
        .bg-gold { background-color: #d4af37; }
        .border-gold { border-color: #d4af37; }
        .btn-gold {
            background-color: #d4af37;
            color: #1a1a2e;
            font-weight: 700;
            transition: background-color 0.2s;
        }
        .btn-gold:hover { background-color: #c9a22e; }
        .btn-gold:active { background-color: #b8931f; }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            border: 3px solid #16213e;
            border-top: 3px solid #d4af37;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .score-bar-bg {
            background-color: #0a0a1a;
            border-radius: 4px;
            overflow: hidden;
        }
        .anauma-card {
            border: 1px solid #d4af37;
            border-radius: 8px;
        }
        .avoid-card {
            border: 1px solid #e74c3c;
            border-radius: 8px;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-lg mx-auto px-4 py-6">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold accent-gold tracking-wide">穴馬ファインダー</h1>
            <p class="text-sm text-gray-400 mt-1">netkeiba対応 穴馬自動分析</p>
        </header>

        <div class="card-bg rounded-xl p-4 mb-6">
            <input
                type="text"
                id="urlInput"
                placeholder="netkeibaのレースURLを貼り付け"
                class="w-full px-4 py-3 rounded-lg bg-[#0f1a30] text-white border border-gray-600 focus:border-[#d4af37] focus:outline-none text-sm"
            />
            <button
                id="analyzeBtn"
                onclick="doAnalyze()"
                class="btn-gold w-full mt-3 py-3 rounded-lg text-lg"
            >
                穴馬を探す！
            </button>
        </div>

        <div id="loading" class="hidden text-center py-8">
            <div class="spinner mx-auto mb-3"></div>
            <p class="text-gray-400">オッズを分析中...</p>
        </div>

        <div id="error" class="hidden bg-red-900/60 border border-red-500 text-red-200 rounded-lg p-4 mb-6 text-sm"></div>

        <div id="result" class="hidden fade-in space-y-4">
            <h2 id="raceName" class="text-xl font-bold accent-gold text-center mb-4"></h2>

            <div id="anaumaSection">
                <h3 class="text-lg font-semibold mb-3 accent-gold">穴馬候補</h3>
                <div id="anaumaList" class="space-y-3"></div>
            </div>

            <div id="avoidSection" class="mt-6">
                <h3 class="text-lg font-semibold mb-3 text-red-400">過剰人気馬（避けるべき）</h3>
                <div id="avoidList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        function scoreColor(score) {
            if (score >= 70) return "#27ae60";
            if (score >= 40) return "#f1c40f";
            return "#e74c3c";
        }

        function buildAnaumaCard(horse, rank) {
            const card = document.createElement("div");
            card.className = "anauma-card card-bg p-4 fade-in";
            card.style.animationDelay = (rank * 0.1) + "s";
            const reasons = (horse.reasons || []).map(r => `<li class="text-xs text-gray-300">・${r}</li>`).join("");
            card.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <span class="bg-gold text-black font-bold rounded-full w-7 h-7 flex items-center justify-center text-sm">${rank + 1}</span>
                        <span class="text-xs text-gray-400">${horse.number || ""}番</span>
                        <span class="font-bold text-white">${horse.name || ""}</span>
                    </div>
                    <span class="text-sm accent-gold font-mono">${horse.win_odds || ""}倍</span>
                </div>
                <div class="score-bar-bg h-3 mb-2">
                    <div class="h-3 rounded" style="width:${horse.score || 0}%;background:${scoreColor(horse.score || 0)};transition:width 0.6s"></div>
                </div>
                <p class="text-xs text-gray-400 mb-1">スコア: ${horse.score || 0}</p>
                <ul class="space-y-0.5">${reasons}</ul>
            `;
            return card;
        }

        function buildAvoidCard(horse) {
            const card = document.createElement("div");
            card.className = "avoid-card card-bg p-3 fade-in";
            card.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-400">${horse.number || ""}番</span>
                        <span class="font-semibold text-red-300">${horse.name || ""}</span>
                    </div>
                    <span class="text-sm text-red-400 font-mono">${horse.win_odds || ""}倍</span>
                </div>
                <p class="text-xs text-gray-400">・${horse.reason || ""}</p>
            `;
            return card;
        }

        function showError(msg) {
            const el = document.getElementById("error");
            el.textContent = msg;
            el.classList.remove("hidden");
        }

        function hideError() {
            document.getElementById("error").classList.add("hidden");
        }

        async function doAnalyze() {
            const url = document.getElementById("urlInput").value.trim();
            if (!url) { showError("URLを入力してください"); return; }
            hideError();
            document.getElementById("result").classList.add("hidden");
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("analyzeBtn").disabled = true;

            try {
                const res = await fetch("/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                if (data.error) { showError(data.error); return; }

                document.getElementById("raceName").textContent = data.race_name || "";

                const anaumaList = document.getElementById("anaumaList");
                anaumaList.innerHTML = "";
                const candidates = data.candidates || [];
                if (candidates.length === 0) {
                    anaumaList.innerHTML = '<p class="text-gray-400 text-center py-4">このレースでは穴馬候補が見つかりませんでした</p>';
                } else {
                    candidates.forEach((h, i) => anaumaList.appendChild(buildAnaumaCard(h, i)));
                }

                const avoidList = document.getElementById("avoidList");
                avoidList.innerHTML = "";
                if (data.avoid && data.avoid.length > 0) {
                    document.getElementById("avoidSection").classList.remove("hidden");
                    data.avoid.forEach(h => avoidList.appendChild(buildAvoidCard(h)));
                } else {
                    document.getElementById("avoidSection").classList.add("hidden");
                }

                document.getElementById("result").classList.remove("hidden");
            } catch (e) {
                showError("通信エラーが発生しました");
            } finally {
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("analyzeBtn").disabled = false;
            }
        }
    </script>
</body>
</html>
